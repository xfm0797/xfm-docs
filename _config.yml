########################################################################
#  XFM 开源官方文档
#  收录 hexo-theme-xfm 与 hexo-theme-xongyi 两套主题的官方技术文档
#  形态：docs（文档模式）
########################################################################

# ============================== 站点基础 ==============================
title: XFM开源官方文档
subtitle: hexo-theme-xfm · hexo-theme-xongyi
description: 高端大气的三模式 Hexo 主题与通用企业官网主题的官方技术文档
keywords: Hexo,主题,hexo-theme-xfm,hexo-theme-xongyi,文档
author: XFM
language: zh-CN
timezone: Asia/Shanghai

# ============================== 网址 ==============================
url: https://xfm0797.github.io/xfm-docs
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
theme: xfm

# ============================== 语法高亮 ==============================
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: false
  wrap: true
  hljs: false

prismjs:
  enable: false

# ============================== RSS / Feed ==============================
# 由 hexo-generator-feed 生成；主题导航栏与页脚的 RSS 入口指向 /atom.xml
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: " "

per_page: 6
pagination_dir: page

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ============================== 主题配置 ==============================
# 站点级覆盖，优先级高于主题自带 themes/xfm/_config.yml
theme_config:
  # 主题默认形态：blog 博客模式（blog / notes / docs）
  # 说明：文档页通过各自 front-matter 的 `mode: docs` 覆盖，仍以 docs 三栏形态渲染
  mode: blog

  appearance:
    scheme: auto
    primary: "#4f6bed"
    radius: normal
    glass_navbar: true

  # 顶部导航
  menu:
    首页:
      path: /
      icon: home
    归档:
      path: /archives/
      icon: archive
    分类:
      path: /categories/
      icon: folder
    标签:
      path: /tags/
      icon: tag
    文档:
      path: /docs/
      icon: file-doc
    笔记:
      path: /notes/
      icon: book
    更多:
      children:
        友链:
          path: /links/
          icon: link
        关于:
          path: /about/
          icon: user

  # 文档模式：侧栏树来自 source/_data/docs.yml
  docs:
    data_file: docs
    expanded: true
    auto_expand: true
    page_nav: true
    last_modified: true
    # 正文底部显示「编辑此页」链接：最终地址 = edit_base + page.source
    edit_link: true
    edit_base: https://github.com/xfm0797/xfm-docs/edit/main/source/
    toc: true

  # 首页
  index:
    hero: true
    layout: card
    cover: false

  search:
    enable: true
    hotkey: true

  footer:
    statistics: true

  social:
    github: https://github.com/xfm0797
    email: mailto:xfm@xfm.qzz.io
    rss: /atom.xml

  # 已安装 hexo-generator-feed，开启导航栏 / 页脚的 RSS 入口
  vendors:
    rss: /atom.xml
    rss_navbar: true

  # 评论：Waline（自建服务端）
  comments:
    enable: true
    type: waline
    lazyload: true
    title: 评论
    waline:
      # 主题 core.js 会把这里的键原样交给 @waline/client v2 的 init()，
      # v2 的必填参数是驼峰 serverURL（主题自带的 server_url 键名对 v2 无效）。
      serverURL: https://waline.xfm.qzz.io
      emoji:
        - https://cdn.jsdelivr.net/gh/walinejs/emojis/weibo
      lang: zh-CN
      avatar: mp

  sitemap:
    enable: true
    robots: true

  # 站点级补丁：主题未内置的能力在站点层补齐（不改主题 submodule）
  custom:
    css:
      # 文档树：分组默认收起、点击展开（含箭头样式）
      - xfm-docs-tree.css
    js:
      # {% tabs %} 选项卡点击切换（主题 core.js 未内置）
      - xfm-tabs.js
      # 文档树分组展开/收起（主题只处理了笔记侧栏）
      - xfm-docs-tree.js
