########################################################################
#  XFM 开源官方文档
#  收录 hexo-theme-xfm 与 hexo-theme-xongyi 两套主题的官方技术文档
#  形态：docs（文档模式）
########################################################################

# ============================== 站点基础 ==============================
title: XFM开源官方文档
subtitle: hexo-theme-xfm · hexo-theme-xongyi
description: 高端大气的三模式 Hexo 主题与通用企业官网主题的官方技术文档
keywords: Hexo,主题,hexo-theme-xfm,hexo-theme-xongyi,文档
author: XFM
language: zh-CN
timezone: Asia/Shanghai

# ============================== 网址 ==============================
url: https://xfm0797.github.io/xfm-docs
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:

source_dir: source
public_dir: public
theme: xfm

# ============================== 语法高亮 ==============================
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: false
  wrap: true
  hljs: false

prismjs:
  enable: false

# ============================== RSS / Feed ==============================
# 由 hexo-generator-feed 生成；主题导航栏与页脚的 RSS 入口指向 /atom.xml
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: " "

per_page: 6
pagination_dir: page

# 归档页不分页：归档是全站文章的完整时间线索引。
# 若沿用 per_page，主题的 archive 模板只会拿到「当前页」的文章，
# 导致顶部「共 N 篇文章」只统计当页、时间线也被截断。
# 设为 0 时 hexo-pagination 输出单页且 posts 为全量。
archive_generator:
  per_page: 0

# 分类页 / 标签页同样不分页：既让顶部篇数等于该分类下的真实总数，
# 也避免分页模板的数字页码（写死为首页 /page/N/）在分类页上跳错页。
category_generator:
  per_page: 0
tag_generator:
  per_page: 0

date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# ============================== 主题配置 ==============================
# 站点级覆盖，优先级高于主题自带 themes/xfm/_config.yml
theme_config:
  # 主题默认形态：blog 博客模式（blog / notes / docs）
  # 说明：文档页通过各自 front-matter 的 `mode: docs`、笔记类文章通过 `mode: notes`
  #       覆盖，仍各自维持自身形态；此处是全站兜底默认。
  mode: blog

  appearance:
    scheme: auto
    primary: "#4f6bed"
    radius: normal
    glass_navbar: true

  # 博客挂件栏：挂件总高超过一屏时 sticky 会让底部挂件始终看不到，
  # 故关闭 sticky，让挂件随页面正常流动（主题 v1.1.0 起该分支也不再加
  # max-height / overflow 裁剪，取代原先的站点级 xfm-blog.css 补丁）
  sidebar:
    sticky: false

  # 顶部导航
  menu:
    首页:
      path: /
      icon: home
    归档:
      path: /archives/
      icon: archive
    分类:
      path: /categories/
      icon: folder
    标签:
      path: /tags/
      icon: tag
    文档:
      path: /docs/
      icon: file-doc
    笔记:
      path: /notes/
      icon: book
    更多:
      children:
        友链:
          path: /links/
          icon: link
        关于:
          path: /about/
          icon: user

  # 菜单显示顺序（主题 v1.1.0 起原生支持）
  # 说明：Hexo 用 deepMerge 合并 theme_config，站点新增的菜单键一律被追加到末尾，
  #       故需要在这里显式声明顺序，把「文档 / 笔记」插到「更多」之前。
  #       未列出的键按配置里的相对顺序排在后面。
  menu_order:
    - 首页
    - 归档
    - 分类
    - 标签
    - 文档
    - 笔记
    - 更多

  # 文档模式：侧栏树来自 source/_data/docs.yml
  docs:
    data_file: docs
    # false = 默认收起全部分支（主题 v1.1.0 起原生支持，取代站点级 CSS/JS 补丁）；
    # 配合 auto_expand: true，只展开「当前页所在的那条分支」，点击后可逐层展开。
    expanded: false
    auto_expand: true
    page_nav: true
    last_modified: true
    # 正文底部显示「编辑此页」链接：最终地址 = edit_base + page.source
    edit_link: true
    edit_base: https://github.com/xfm0797/xfm-docs/edit/main/source/
    toc: true

  # 笔记模式：左侧导航的收录范围与排列方式
  # 说明：note_categories / note_tags 为主题 v1.1.0 起原生支持（两者皆空 = 收录全站文章，
  #       同时配置取交集）；本站约定「笔记」= 更新日志类记录。
  #       笔记类文章需在 front-matter 标注 mode: notes，左侧导航才会常驻。
  notes:
    # 只收录这些分类下的文章（空数组 = 不过滤，即列全站文章）
    note_categories:
      - 更新日志
    # 只收录带这些标签的文章（空数组 = 不过滤；与 note_categories 同时配置时取交集）
    note_tags: []
    # 分组方式：none（不分组）/ category / date
    group_by: none
    # 组内排序：date / title / order
    sort_by: date
    # 排序方向：asc / desc
    order: desc
    # 条目是否显示日期
    show_date: true
    # 侧栏顶部是否显示搜索入口
    search: true

  # 首页
  index:
    hero: true
    layout: card
    cover: false

  search:
    enable: true
    hotkey: true

  footer:
    statistics: true

  social:
    github: https://github.com/xfm0797
    email: mailto:xfm@xfm.qzz.io
    rss: /atom.xml

  # 已安装 hexo-generator-feed，开启导航栏 / 页脚的 RSS 入口
  vendors:
    rss: /atom.xml
    rss_navbar: true

  # 评论：Waline（自建服务端）
  comments:
    enable: true
    type: waline
    lazyload: true
    title: 评论
    waline:
      # 主题 core.js 会把这里的键原样交给 @waline/client v2 的 init()，
      # v2 的必填参数是驼峰 serverURL（主题自带的 server_url 键名对 v2 无效）。
      serverURL: https://waline.xfm.qzz.io
      emoji:
        - https://cdn.jsdelivr.net/gh/walinejs/emojis/weibo
      lang: zh-CN
      avatar: mp

  sitemap:
    enable: true
    robots: true

  # 右下角悬浮按钮组（主题 v1.3.0）
  # 目录按钮默认只在文档模式出现（toc_modes: [docs]）。本站笔记文章同样是
  # notes 形态、窄屏下左侧笔记导航为 offcanvas，没有这个按钮就打不开笔记树，
  # 故一并纳入。
  floating:
    enable: true
    toc: true
    toc_modes: [docs, notes]
    back_to_top: true

  # 站点级资源注入槽位（custom.css / custom.js）：主题已原生支持此前规避的
  # 全部缺陷（文档树折叠、tabs 切换、分页结构、挂件滚动、笔记收录范围、
  # 菜单顺序、空白目录栏、窄屏导航栏菜单按钮被 flex 压缩到 0 宽）。
  # 对应补丁均已移除；后续若需再打站点补丁，在此追加资源名即可
  # （物理文件放 source/css/、source/js/）。
  custom:
    css: []
    js: []
